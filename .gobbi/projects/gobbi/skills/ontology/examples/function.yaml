# Flight sample: the Functions of the flight-operations area. See area.yaml.
functions:
  meetsMinimumConnectionTime:
    status: "active"
    description: "A check of whether an outbound booking leaves enough time after an inbound booking, where the outbound flight is the same passenger's first booked flight scheduled to depart after the inbound flight's scheduled arrival and departs from the inbound flight's arrival airport."
    aliases:
      - "MCT check"
    responsibility: "It owns the comparison of a connection's gap with the connecting airport's minimum connection time."
    boundary: "The minimum connection time value, which Airport owns, the passenger's personal data, which Passenger owns, and every change to a booking or a flight, which Action types own."
    neverTouches:
      - "passenger"
      - "aircraft"
    parameters:
      inbound:
        description: "The booking on the arriving flight."
        dataType: "object"
        objectTypeApiName: "booking"
        required: "true"
      outbound:
        description: "The booking on the departing flight."
        dataType: "object"
        objectTypeApiName: "booking"
        required: "true"
    output:
      description: "Exact for the current estimated times: true when the outbound flight's estimated departure is at least the connecting airport's minimum connection time after the inbound flight's estimated arrival."
      dataType: "boolean"
    method: "rule"
    reads:
      - "bookingFlight"
      - "bookingPassenger"
      - "flightArrivalAirport"
      - "flightDepartureAirport"
      - "flight.scheduledArrival"
      - "flight.scheduledDeparture"
      - "flight.estimatedArrival"
      - "flight.estimatedDeparture"
      - "airport.minimumConnectionTime"
