# Flight sample: the Action types of the flight-operations area. See area.yaml.
actionTypes:
  delayFlight:
    status: "active"
    description: "The operation that moves both estimated times of a scheduled flight later by the same amount, with a reason."
    responsibility: "It owns the decision to move a scheduled flight's estimated times later."
    boundary: "The flight's state, which only the Flight lifecycle Action types change, and the connection checks that follow, which Check connections after change runs."
    neverTouches:
      - "aircraft"
    parameters:
      flight:
        description: "The flight to delay."
        dataType: "object"
        objectTypeApiName: "flight"
        required: "true"
      newEstimatedDeparture:
        description: "The new estimated departure time."
        dataType: "timestamp"
        required: "true"
      reason:
        description: "Why the flight is delayed."
        dataType: "string"
        required: "true"
    submissionCriteria:
      - "The flight's state is scheduled."
      - "The new estimated departure is later than the current estimated departure."
    operations:
      - type: "modifyObject"
        objectTypeApiName: "flight"
        propertyApiNames:
          - "estimatedDeparture"
          - "estimatedArrival"
          - "delayReason"
    sideEffects:
      - "Notify each passenger booked on the flight."
  cancelFlight:
    status: "active"
    description: "The operation that ends a scheduled flight before it departs."
    responsibility: "It owns the decision to cancel a flight that has not departed."
    boundary: "Rebooking the flight's passengers onto other flights, which is outside this area."
    neverTouches:
      - "aircraft"
    parameters:
      flight:
        description: "The flight to cancel."
        dataType: "object"
        objectTypeApiName: "flight"
        required: "true"
      reason:
        description: "Why the flight is cancelled."
        dataType: "string"
        required: "true"
    submissionCriteria:
      - "The flight's state is scheduled."
    operations:
      - type: "modifyObject"
        objectTypeApiName: "flight"
        propertyApiNames:
          - "state"
    sideEffects:
      - "Notify each passenger booked on the flight, with the reason."
  departFlight:
    status: "active"
    description: "The operation that records that a scheduled flight has left its departure airport."
    responsibility: "It owns the record that a flight has departed."
    boundary: "The estimated times, which Delay flight moves."
    neverTouches:
      - "passenger"
      - "booking"
    parameters:
      flight:
        description: "The flight to record as departed."
        dataType: "object"
        objectTypeApiName: "flight"
        required: "true"
    submissionCriteria:
      - "The flight's state is scheduled."
    operations:
      - type: "modifyObject"
        objectTypeApiName: "flight"
        propertyApiNames:
          - "state"
  arriveFlight:
    status: "active"
    description: "The operation that records that a departed flight has reached its arrival airport."
    responsibility: "It owns the record that a flight has arrived."
    boundary: "The estimated times, which Delay flight moves."
    neverTouches:
      - "passenger"
      - "booking"
    parameters:
      flight:
        description: "The flight to record as arrived."
        dataType: "object"
        objectTypeApiName: "flight"
        required: "true"
    submissionCriteria:
      - "The flight's state is departed."
    operations:
      - type: "modifyObject"
        objectTypeApiName: "flight"
        propertyApiNames:
          - "state"
