# Process: the states of one Object type and the Action types that move it between them.
# Kind block process, in the group processes. Add: python3 <ontology skill>/scripts/ontology.py add <file>
#   process <id>
# Common keys, placeholders, ids, references, and YAML rules: the ontology SKILL.md, Record.
#
# Rules:
# - Only Action types move a state. A final state is a state with no transition out.
#
# Relationship: relationship has exactly one parent, the state Property, such as flight.state. Each transition
# names its Action type.
#
# Review checklist (validate does not check these):
# - The parent Property has an enum constraint. initialState and every inputStates and outputStates value are
#   among its options, and every option appears in one of them.
# - Each transition's Action type sets the state Property, and has a criterion that requires an input state.
#
# Palantir: Machinery has no API schema. initialState, inputStates, and outputStates are its terms.
process:
  initialState: "{state value in which each member starts}"
  transitions:
    - actionTypeApiName: "{Action type reference}"
      inputStates:
        - "{state value before the Action type runs}"
      outputStates:
        - "{state value after it runs}"
