# --- Repository Codex model/effort policy. ---
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"

# --- Local checkout sandbox/network posture. ---
# These tracked values are separate from the shipped model/effort policy.
# See skills/git/SKILL.md § Runtime git environment and
# skills/git/conventions.md § Runtime git posture.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
model_verbosity = "high"
web_search = "cached"

[sandbox_workspace_write]
network_access = true
writable_roots = []

[agents]
max_threads = 6
max_depth = 1
