# Template for one Link type unit. The format and checks are in the ontology skill's record.md.
# For the first unit, replace linkTypes: {} in the area file with this block; later, copy only the unit.
# Rename ids, replace every {...} placeholder, and delete each optional key that has no value.
linkTypes:
  linkTypeId:
    displayName: "{optional: preferred name, only when it differs from the id in words}"
    status: "{experimental, active, or deprecated}"
    description: "{one sentence that tells a member from a non-member}"
    aliases:
      - "{optional: non-preferred term that maps to the preferred name}"
    responsibility: "{what only this unit owns: one decision, or the facts about one concept}"
    boundary: "{what is outside the unit, and which unit owns it}"
    neverTouches:
      - "{optional: reference to a unit this unit never touches}"
    sides:
      - apiName: "{first side, which starts from the owning end: name of the far end; plural when many}"
        objectTypeApiName: "{object type reference: the far end of this side}"
        cardinality: "{one or many: how many far-end members one near-end member links to}"
      - apiName: "{second side: name of the owning end, seen from the far end; plural when many}"
        objectTypeApiName: "{object type reference: the owning end}"
        cardinality: "{one or many}"
